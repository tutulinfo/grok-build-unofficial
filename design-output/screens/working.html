<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Working — Grok Build</title>
    <link rel="stylesheet" href="../design-system/tokens.css" />
    <link rel="stylesheet" href="../components/chrome.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="m-0 min-h-screen bg-[var(--bg)] font-[var(--font-ui)] text-[var(--text)] text-[length:var(--text-body)] leading-[var(--leading-body)] antialiased">
    <aside class="w-full min-w-[280px] h-dvh flex flex-col">
      <header class="gb-header">
        <div class="gb-brand">
          <span class="gb-brand-mark" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M5 0.6 9.4 5 5 9.4 0.6 5Z" fill="currentColor"/></svg></span>
          <span>GROK BUILD</span>
          <span class="gb-brand-tag">unofficial</span>
        </div>
        <div class="gb-header-actions">
          <button class="gb-icon" title="Switch to light theme" aria-label="Switch to light theme"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg></button>
          <button class="gb-icon" title="New session" aria-label="New session"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg></button>
          <button class="gb-icon" title="Session history" aria-label="Session history"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.5l2 1.5"/></svg></button>
          <button class="gb-icon" title="Rewind to an earlier prompt" aria-label="Rewind"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h6.2a3.8 3.8 0 1 1-3.8 3.8"/><path d="M5.4 5.6 3 8l2.4 2.4"/></svg></button>
          <button class="gb-icon is-active" title="Hide thinking" aria-label="Toggle thinking"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2.5 9 6l3.5.2L10 8.5 11 12 8 10l-3 2 1-3.5-2.5-2.3L7 6z"/></svg></button>
          <button class="gb-icon" title="More" aria-label="More"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="3.5" cy="8" r=".75" fill="currentColor"/><circle cx="8" cy="8" r=".75" fill="currentColor"/><circle cx="12.5" cy="8" r=".75" fill="currentColor"/></svg></button>
        </div>
      </header>

      <div class="flex-1 min-h-0 overflow-y-auto px-[var(--space-5)] py-[var(--space-3)]">
        <div class="flex justify-end mb-[var(--space-6)]">
          <p class="m-0 max-w-[85%] rounded-[var(--radius-lg)] bg-[var(--bg-raised)] px-[var(--space-4)] py-[var(--space-2)] text-[length:var(--text-ui)]">take time in working stage</p>
        </div>

        <div class="gb-live" aria-live="polite">
          <span class="gb-live-icons" aria-hidden="true">
            <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2.2 9.1 6.1 13 6.3 10.1 8.7 11.2 12.6 8 10.6 4.8 12.6 5.9 8.7 3 6.3 6.9 6.1z" fill="#e8a0b8"/><circle cx="8" cy="8" r="2.2" fill="#7ec8e8"/></svg></span>
            <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4"/><path d="m13 13-2.4-2.4"/></svg></span>
            <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 12.5 12 4l1.5 1.5-8.5 8.5H3.5v-1.5z"/></svg></span>
            <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2.2 9.1 6.1 13 6.3 10.1 8.7 11.2 12.6 8 10.6 4.8 12.6 5.9 8.7 3 6.3 6.9 6.1z" fill="#e8a0b8"/><circle cx="8" cy="8" r="2.2" fill="#7ec8e8"/></svg></span>
          </span>
          <span class="gb-live-copy">
            <span>Thinking</span>
            <span>Searching</span>
            <span>Using tools</span>
            <span>Working for 3s</span>
          </span>
        </div>

        <div class="flex flex-col gap-[var(--space-2)] text-[length:var(--text-ui)] text-[var(--text-muted)]">
          <div class="flex items-center gap-[var(--space-2)]">
            <span class="task-live text-[var(--text-muted)]"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4"/><path d="m13 13-2.4-2.4"/></svg></span>
            <span class="w-14 shrink-0 text-[length:var(--text-meta)] tracking-wide">SEARCH</span>
            <span class="min-w-0 flex-1 truncate font-[var(--font-code)] text-[length:var(--text-meta)]">PermissionGate always-allow prefix</span>
            <span class="text-[length:var(--text-meta)] text-[var(--success)]">0.8s</span>
          </div>
          <div class="flex items-center gap-[var(--space-2)]">
            <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 3.5h5.5L12 6v6.5H4z"/><path d="M9.5 3.5V6H12"/></svg></span>
            <span class="w-14 shrink-0 text-[length:var(--text-meta)] tracking-wide">READ</span>
            <a href="#" class="min-w-0 flex-1 truncate font-[var(--font-code)] text-[length:var(--text-meta)] text-[var(--accent)] no-underline hover:underline" title="Opens in VS Code editor">src/host/permissions.ts:118</a>
            <span class="text-[length:var(--text-meta)] text-[var(--success)]">0.3s</span>
          </div>
          <div class="flex items-center gap-[var(--space-2)]">
            <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 12.5 12 4l1.5 1.5-8.5 8.5H3.5v-1.5z"/></svg></span>
            <span class="w-14 shrink-0 text-[length:var(--text-meta)] tracking-wide">EDIT</span>
            <a href="#" class="min-w-0 flex-1 truncate font-[var(--font-code)] text-[length:var(--text-meta)] text-[var(--accent)] no-underline hover:underline" title="Opens in VS Code editor">src/host/permissions.ts</a>
            <span class="text-[length:var(--text-meta)] text-[var(--success)]">+18 −4</span>
            <button class="min-h-8 px-[var(--space-2)] text-[length:var(--text-meta)] text-[var(--text-muted)] hover:text-[var(--text)]" title="Opens VS Code side-by-side diff">diff</button>
            <button class="min-h-8 px-[var(--space-2)] text-[length:var(--text-meta)] text-[var(--text-muted)] hover:text-[var(--text)]" title="Opens in VS Code editor">open</button>
          </div>
          <div class="flex items-center gap-[var(--space-2)]">
            <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="11" height="9" rx="1"/><path d="M5 8h2l.8 2 1.4-4 1 2h.8"/></svg></span>
            <span class="w-14 shrink-0 text-[length:var(--text-meta)] tracking-wide">RUN</span>
            <span class="min-w-0 flex-1 truncate font-[var(--font-code)] text-[length:var(--text-meta)]">$ npm test</span>
          </div>
        </div>
      </div>

      <p class="shrink-0 px-[var(--space-5)] pb-[var(--space-2)] text-[length:var(--text-meta)] text-[var(--text-faint)]">working · Permission gate prefix · ctx 31% · $0.042</p>

      <form class="gb-composer" action="#">
        <textarea rows="1" placeholder="Ask anything"></textarea>
        <div class="gb-toolbar">
          <div class="gb-toolbar-left">
            <button type="button" class="gb-icon" title="Attach image" aria-label="Attach image"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
            <button type="button" class="gb-chip">Ask</button>
            <button type="button" class="gb-chip">grok-4.6</button>
            <button type="button" class="gb-chip">Fast <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
          </div>
          <button type="button" class="gb-stop" aria-label="Stop" title="Stop"><span class="gb-stop-mark"></span></button>
        </div>
      </form>
    </aside>
  </body>
</html>
