<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chats — no match — Grok Build</title>
    <link rel="stylesheet" href="../design-system/tokens.css" />
    <link rel="stylesheet" href="../components/chrome.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="gb-page">
    <aside class="gb-rail">
      <header class="gb-header">
        <div class="gb-brand">
          <button class="gb-icon" aria-label="Back to chat">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3.5 5.5 8 10 12.5"/></svg>
            <span class="gb-tooltip">Back to chat</span>
          </button>
          <span>Chats</span>
        </div>
        <div class="gb-header-actions">
          <button class="gb-icon" data-theme-toggle aria-label="Switch to light theme"><svg class="gb-theme-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg><svg class="gb-theme-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.8 2.6a5.4 5.4 0 1 0 3.6 9.5 4.6 4.6 0 0 1-3.6-9.5z"/></svg><span class="gb-tooltip">Switch to light theme</span></button>
          <button class="gb-chip" type="button">New chat</button>
        </div>
      </header>

      <div class="gb-scroll px-4 py-4">
        <input type="search" class="gb-field mb-5" value="worktree xyz" aria-label="Search chats" />

        <div class="mt-16">
           <p class="m-0 text-[13px] gb-ink">Nothing matches “worktree xyz”.</p>
        </div>
      </div>
    </aside>
    <script src="../components/theme.js"></script>
  </body>
</html>
