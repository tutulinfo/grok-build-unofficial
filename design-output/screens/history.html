<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History — Grok Build</title>
    <link rel="stylesheet" href="../design-system/tokens.css" />
    <link rel="stylesheet" href="../components/chrome.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="gb-page">
    <div class="gb-shell">
      <nav class="gb-nav-drawer" aria-label="Chat history">
        <div class="flex items-center gap-[var(--space-2)] px-[10px] mb-[var(--space-3)]">
          <button class="gb-icon" title="Collapse history" aria-label="Collapse history">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3.5v9M7.5 8H13M7.5 8l2.5-2.5M7.5 8 10 10.5"/></svg>
          </button>
          <button class="gb-chip" title="New session">New chat</button>
        </div>
        <input type="search" class="gb-field mb-[var(--space-3)]" value="perm" placeholder="Search chats" />

        <p class="gb-nav-label">Today</p>
        <button class="gb-nav-item is-current">Permission gate prefix</button>
        <button class="gb-nav-item">take time in working stage</button>

        <p class="gb-nav-label">Yesterday</p>
        <button class="gb-nav-item">Worktree apply dry-run</button>
        <div class="gb-nav-item" style="background: var(--bg-hover)">
          <p class="m-0">Delete “Old typecheck loop”?</p>
          <div class="mt-[var(--space-2)] flex gap-[var(--space-2)]">
            <button class="gb-btn" type="button">Cancel</button>
            <button class="gb-btn-danger" type="button">Delete</button>
          </div>
        </div>

        <p class="gb-nav-label">This week</p>
        <div class="flex items-center gap-[var(--space-1)]">
          <input class="gb-field" value="Worktree apply dry-run" />
        </div>
        <div class="flex gap-[var(--space-2)] px-[10px] mt-[var(--space-2)]">
          <button class="gb-btn" type="button">Save</button>
          <button class="gb-btn" type="button">Cancel</button>
        </div>
        <button class="gb-nav-item">Empty first-run setup</button>

        <p class="gb-nav-label">Rewind</p>
        <p class="m-0 mx-[10px] mb-[var(--space-2)] text-[length:var(--text-meta)] text-[var(--text-muted)]">Restores chat to that prompt. Does not undo file writes.</p>
        <button class="gb-nav-item">Fix Always allow prefix</button>
        <button class="gb-nav-item">Read permissions.ts</button>
        <button class="gb-nav-item">Session start</button>

        <p class="gb-nav-label">Worktree</p>
        <input class="gb-field mb-[var(--space-2)]" value="perm-gate" aria-label="Worktree name" />
        <div class="flex flex-wrap gap-[var(--space-2)] px-[10px]">
          <button class="gb-btn-primary" type="button">Create</button>
          <button class="gb-btn" type="button">Move session</button>
          <button class="gb-btn" type="button">Open…</button>
          <button class="gb-btn" type="button">Apply…</button>
          <button class="gb-btn-danger" type="button">Remove…</button>
        </div>
      </nav>

      <aside class="gb-rail min-w-0">
        <header class="gb-header">
          <div class="gb-brand">
            <span class="gb-brand-mark" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M5 0.6 9.4 5 5 9.4 0.6 5Z" fill="currentColor"/></svg></span>
            <span>GROK BUILD</span>
            <span class="gb-brand-tag">unofficial</span>
          </div>
          <div class="gb-header-actions">
            <button class="gb-icon" title="Switch to light theme" aria-label="Switch to light theme"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg></button>
            <button class="gb-icon" title="New session" aria-label="New session"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg></button>
            <button class="gb-icon is-active" title="Session history" aria-label="Session history"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.5l2 1.5"/></svg></button>
            <button class="gb-icon" title="Rewind to an earlier prompt" aria-label="Rewind"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
            <button class="gb-icon" title="Hide thinking" aria-label="Toggle thinking"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2.5 9 6l3.5.2L10 8.5 11 12 8 10l-3 2 1-3.5-2.5-2.3L7 6z"/></svg></button>
            <button class="gb-icon" title="More" aria-label="More"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="3.5" cy="8" r=".75" fill="currentColor"/><circle cx="8" cy="8" r=".75" fill="currentColor"/><circle cx="12.5" cy="8" r=".75" fill="currentColor"/></svg></button>
          </div>
        </header>
        <div class="flex-1"></div>
        <p class="gb-status">ready · Permission gate prefix · ctx 41%</p>
        <form class="gb-composer" action="#">
          <textarea rows="1" placeholder="Ask anything"></textarea>
          <div class="gb-toolbar">
            <div class="gb-toolbar-left">
              <button type="button" class="gb-icon" title="Attach image" aria-label="Attach image"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
              <button type="button" class="gb-chip">Ask</button>
              <button type="button" class="gb-chip">grok-4.6</button>
              <button type="button" class="gb-chip">Fast <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
            </div>
            <button type="button" class="gb-send" aria-label="Send" title="Send"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M8 12.5V3.5M4.5 7 8 3.5 11.5 7"/></svg></button>
          </div>
        </form>
      </aside>
    </div>
  </body>
</html>
