<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stopped — Grok Build</title>
    <link rel="stylesheet" href="../design-system/tokens.css" />
    <link rel="stylesheet" href="../components/chrome.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="gb-page">
    <aside class="gb-rail">
      <header class="gb-header">
        <div class="gb-brand">
          <span class="gb-brand-mark" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M5 0.6 9.4 5 5 9.4 0.6 5Z" fill="currentColor"/></svg></span>
          <span>GROK BUILD</span>
          <span class="gb-brand-tag">unofficial</span>
        </div>
        <div class="gb-header-actions">
          <button class="gb-icon" data-theme-toggle aria-label="Switch to light theme"><svg class="gb-theme-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg><svg class="gb-theme-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.8 2.6a5.4 5.4 0 1 0 3.6 9.5 4.6 4.6 0 0 1-3.6-9.5z"/></svg><span class="gb-tooltip">Switch to light theme</span></button>
          <button class="gb-icon" aria-label="New chat"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg><span class="gb-tooltip">New chat</span></button>
          <button class="gb-icon" aria-label="Chat history"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.5l2 1.5"/></svg><span class="gb-tooltip">Chat history</span></button>
          <button class="gb-icon" aria-label="Rewind"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="gb-tooltip">Rewind to an earlier prompt</span></button>
          <button class="gb-icon" aria-label="Hide thinking"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2.5 9 6l3.5.2L10 8.5 11 12 8 10l-3 2 1-3.5-2.5-2.3L7 6z"/></svg><span class="gb-tooltip">Hide thinking</span></button>
          <button class="gb-icon" aria-label="More"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="3.5" cy="8" r=".75" fill="currentColor"/><circle cx="8" cy="8" r=".75" fill="currentColor"/><circle cx="12.5" cy="8" r=".75" fill="currentColor"/></svg><span class="gb-tooltip is-end">More</span></button>
        </div>
      </header>

      <div class="gb-scroll px-4 py-5">
        <p class="gb-user">Run the smoke test.</p>
        <p class="gb-msg">Launching the extension host for the packaged build…</p>
        <p class="m-0 mb-5 flex items-center gap-[var(--space-2)] text-[12px] text-[var(--text-faint)]">
          <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-[var(--danger)]"></span>
          grok exited
        </p>
      </div>

      <p class="gb-status">stopped · grok exited · ctx 12% · $0.008</p>

      <form class="gb-composer" action="#">
        <textarea rows="1" placeholder="Ask anything"></textarea>
        <div class="gb-toolbar">
          <div class="gb-toolbar-left">
            <button type="button" class="gb-icon" aria-label="Attach image"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
            <button type="button" class="gb-chip gb-dd">Ask</button>
            <button type="button" class="gb-chip gb-dd">Grok 4.6</button>
            <button type="button" class="gb-chip gb-dd">Fast</button>
          </div>
          <button type="button" class="gb-restart" aria-label="Restart agent">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 8a4.5 4.5 0 1 0 1.3-3.2"/><path d="M3.5 3.5v3h3"/></svg>
            <span class="gb-tooltip is-end">Restart agent</span>
          </button>
        </div>
      </form>
    </aside>
    <script src="../components/theme.js"></script>
  </body>
</html>
