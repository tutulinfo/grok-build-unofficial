<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Composer — Grok Build</title>
    <link rel="stylesheet" href="../design-system/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      button:focus-visible, a:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
        outline: var(--focus-ring-width) solid var(--focus);
        outline-offset: var(--focus-ring-offset);
      }
    </style>
  </head>
  <body class="m-0 min-h-screen flex bg-[var(--desk)] font-[var(--font-ui)] text-[var(--text)] text-[length:var(--text-body)] leading-[var(--leading-body)] antialiased">
    <aside class="w-full min-w-[280px] h-dvh flex flex-col bg-[var(--bg)] relative">
      <header class="h-10 shrink-0 flex items-center justify-between px-[var(--space-3)] border-b border-[var(--border)]">
        <div class="flex items-center gap-[var(--space-2)] min-w-0">
          <span class="text-[length:var(--text-ui)] font-[var(--weight-medium)] tracking-wide">◆ GROK BUILD</span>
          <span class="text-[10px] leading-none px-[var(--space-2)] py-[3px] rounded-[var(--radius-pill)] border border-[var(--border-strong)] text-[var(--text-faint)]">unofficial</span>
        </div>
        <div class="flex items-center gap-[var(--space-1)]">
          <button class="size-8 grid place-items-center rounded-[var(--radius-sm)] text-[var(--text-muted)] hover:bg-[var(--bg-hover)]" title="Switch to light theme" aria-label="Switch to light theme"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg></button>
          <button class="size-8 grid place-items-center rounded-[var(--radius-sm)] text-[var(--text-muted)] hover:bg-[var(--bg-hover)]" title="New session" aria-label="New session"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg></button>
          <button class="size-8 grid place-items-center rounded-[var(--radius-sm)] text-[var(--text-muted)] hover:bg-[var(--bg-hover)]" title="Session history" aria-label="Session history"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.5l2 1.5"/></svg></button>
          <button class="size-8 grid place-items-center rounded-[var(--radius-sm)] text-[var(--text-muted)] hover:bg-[var(--bg-hover)]" title="Rewind to an earlier prompt" aria-label="Rewind"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8H2l3-3.5"/><path d="M3.5 8a4.5 4.5 0 1 0-1.2-3"/></svg></button>
          <button class="size-8 grid place-items-center rounded-[var(--radius-sm)] text-[var(--text-muted)] hover:bg-[var(--bg-hover)]" title="Hide thinking" aria-label="Toggle thinking"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2.5 9 6l3.5.2L10 8.5 11 12 8 10l-3 2 1-3.5-2.5-2.3L7 6z"/></svg></button>
          <button class="size-8 grid place-items-center rounded-[var(--radius-sm)] text-[var(--text)] bg-[var(--bg-hover)]" title="More" aria-label="More" aria-expanded="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="3.5" cy="8" r=".75" fill="currentColor"/><circle cx="8" cy="8" r=".75" fill="currentColor"/><circle cx="12.5" cy="8" r=".75" fill="currentColor"/></svg></button>
        </div>
      </header>

      <div class="absolute right-[var(--space-3)] top-10 z-[var(--z-popover)] w-52 rounded-[var(--radius-md)] border border-[var(--border)] bg-[var(--bg-raised)] py-[var(--space-1)] text-[length:var(--text-ui)]">
        <button class="w-full text-left px-[var(--space-3)] py-[var(--space-2)] hover:bg-[var(--bg-hover)]">Open user config</button>
        <button class="w-full text-left px-[var(--space-3)] py-[var(--space-2)] text-[var(--text-muted)] opacity-[var(--btn-disabled-opacity)] cursor-[var(--btn-disabled-cursor)]" disabled>MCP servers <span class="text-[length:var(--text-meta)]">config only</span></button>
        <button class="w-full text-left px-[var(--space-3)] py-[var(--space-2)] text-[var(--text-muted)] opacity-[var(--btn-disabled-opacity)] cursor-[var(--btn-disabled-cursor)]" disabled>Select skills… <span class="text-[length:var(--text-meta)]">leader-only</span></button>
        <button class="w-full text-left px-[var(--space-3)] py-[var(--space-2)] hover:bg-[var(--bg-hover)]">Output log</button>
        <button class="w-full text-left px-[var(--space-3)] py-[var(--space-2)] text-[var(--danger)] hover:bg-[var(--btn-danger-hover)]">Restart agent</button>
        <button class="w-full text-left px-[var(--space-3)] py-[var(--space-2)] hover:bg-[var(--bg-hover)]">About</button>
      </div>

      <div class="h-7 shrink-0 flex items-center justify-between gap-[var(--space-2)] px-[var(--space-3)] border-b border-[var(--border)] text-[length:var(--text-meta)] text-[var(--text-muted)]">
        <div class="flex items-center gap-[var(--space-2)] min-w-0">
          <span class="size-1.5 rounded-[var(--radius-pill)] bg-[var(--success)]"></span>
          <span>ready</span>
          <span class="truncate">Permission gate prefix</span>
        </div>
        <span class="tabular-nums">ctx 41%</span>
      </div>

      <div class="flex-1 min-h-0 overflow-y-auto px-[var(--space-3)] py-[var(--space-4)]">
        <div class="ml-8 rounded-[var(--radius-md)] bg-[var(--bg-raised)] px-[var(--space-3)] py-[var(--space-2)] text-[length:var(--text-ui)]">Show me context after this turn.</div>
      </div>

      <div class="shrink-0 px-[var(--space-3)]">
        <div class="mb-[var(--space-2)] rounded-[var(--radius-md)] border border-[var(--border)] bg-[var(--bg-raised)] p-[var(--space-3)]">
          <div class="flex items-center justify-between gap-[var(--space-2)]">
            <p class="m-0 text-[length:var(--text-ui)]"><span class="inline-grid place-items-center min-w-5 h-5 px-1 rounded-[var(--radius-pill)] bg-[var(--accent-subtle)] text-[var(--accent)] text-[length:var(--text-meta)]">2</span> Waiting to send</p>
            <div class="flex gap-[var(--space-2)]">
              <button class="min-h-8 px-[var(--space-2)] text-[length:var(--text-meta)] text-[var(--accent)] hover:underline">Send all now</button>
              <button class="min-h-8 px-[var(--space-2)] text-[length:var(--text-meta)] text-[var(--text-muted)] hover:text-[var(--text)]">Clear</button>
            </div>
          </div>
          <div class="mt-[var(--space-2)] flex items-center justify-between gap-[var(--space-2)] text-[length:var(--text-meta)] text-[var(--text-muted)]">
            <span class="truncate">Also run the smoke test after typecheck.</span>
            <button class="min-h-8 px-[var(--space-2)] text-[var(--accent)] hover:underline shrink-0">Send</button>
          </div>
        </div>
      </div>

      <form class="shrink-0 p-[var(--space-3)] pt-0 relative" action="#">
        <div class="absolute left-[var(--space-3)] right-[var(--space-3)] bottom-full mb-1 z-[var(--z-popover)] rounded-[var(--radius-md)] border border-[var(--border)] bg-[var(--bg-raised)] py-[var(--space-1)] overflow-hidden">
          <p class="m-0 px-[var(--space-3)] py-[var(--space-1)] text-[length:var(--text-meta)] text-[var(--text-faint)]">↑↓ Enter</p>
          <button type="button" class="w-full text-left px-[var(--space-3)] py-[var(--space-2)] bg-[var(--accent-subtle)]">
            <span class="font-[var(--font-code)] text-[length:var(--text-ui)]">/context</span>
            <span class="block text-[length:var(--text-meta)] text-[var(--text-muted)]">Show remaining context window</span>
          </button>
          <button type="button" class="w-full text-left px-[var(--space-3)] py-[var(--space-2)] hover:bg-[var(--bg-hover)]">
            <span class="font-[var(--font-code)] text-[length:var(--text-ui)]">/compact</span>
            <span class="block text-[length:var(--text-meta)] text-[var(--text-muted)]">Summarize the session to free space</span>
          </button>
          <button type="button" class="w-full text-left px-[var(--space-3)] py-[var(--space-2)] hover:bg-[var(--bg-hover)]">
            <span class="font-[var(--font-code)] text-[length:var(--text-ui)]">/usage</span>
            <span class="block text-[length:var(--text-meta)] text-[var(--text-muted)]">Token and cost breakdown</span>
          </button>
          <button type="button" class="w-full text-left px-[var(--space-3)] py-[var(--space-2)] hover:bg-[var(--bg-hover)]">
            <span class="font-[var(--font-code)] text-[length:var(--text-ui)]">/effort</span>
            <span class="block text-[length:var(--text-meta)] text-[var(--text-muted)]">Set reasoning effort</span>
          </button>
          <button type="button" class="w-full text-left px-[var(--space-3)] py-[var(--space-2)] hover:bg-[var(--bg-hover)]">
            <span class="font-[var(--font-code)] text-[length:var(--text-ui)]">/model</span>
            <span class="block text-[length:var(--text-meta)] text-[var(--text-muted)]">Switch model for this session</span>
          </button>
          <button type="button" class="w-full text-left px-[var(--space-3)] py-[var(--space-2)] hover:bg-[var(--bg-hover)]">
            <span class="font-[var(--font-code)] text-[length:var(--text-ui)]">/help</span>
            <span class="block text-[length:var(--text-meta)] text-[var(--text-muted)]">List slash commands</span>
          </button>
        </div>

        <div class="rounded-[var(--radius-lg)] border border-[var(--border)] bg-[var(--bg-raised)] p-[var(--space-2)]">
          <div class="flex gap-[var(--space-2)] px-[var(--space-2)] pt-[var(--space-1)]">
            <span class="relative size-9 rounded-[var(--radius-sm)] bg-[var(--bg-inset)] border border-[var(--border)]">
              <span class="absolute inset-0 grid place-items-center text-[length:var(--text-meta)] text-[var(--text-faint)]">img</span>
              <button type="button" class="absolute -top-1 -right-1 size-4 grid place-items-center rounded-[var(--radius-pill)] bg-[var(--bg)] text-[var(--text-muted)]" aria-label="Remove">×</button>
            </span>
            <span class="relative size-9 rounded-[var(--radius-sm)] bg-[var(--bg-inset)] border border-[var(--border)]">
              <span class="absolute inset-0 grid place-items-center text-[length:var(--text-meta)] text-[var(--text-faint)]">img</span>
              <button type="button" class="absolute -top-1 -right-1 size-4 grid place-items-center rounded-[var(--radius-pill)] bg-[var(--bg)] text-[var(--text-muted)]" aria-label="Remove">×</button>
            </span>
            <button type="button" class="size-9 rounded-[var(--radius-sm)] border border-[var(--border)] text-[length:var(--text-meta)] text-[var(--text-muted)] hover:bg-[var(--bg-hover)]">+1</button>
          </div>
          <textarea rows="2" class="w-full resize-none bg-transparent border-0 p-[var(--space-2)] text-[length:var(--text-body)] font-[var(--font-ui)]">/con</textarea>
          <div class="flex items-center gap-[var(--space-1)] px-[var(--space-1)] pb-[var(--space-1)] flex-wrap">
            <button type="button" class="size-8 grid place-items-center rounded-[var(--radius-sm)] text-[var(--text-muted)] hover:bg-[var(--bg-hover)]" title="Attach image" aria-label="Attach image"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 8.5 4.5 11A2.2 2.2 0 1 0 7.6 14l5-5a2.8 2.8 0 0 0-4-4l-5.2 5.2"/></svg></button>
            <div class="relative">
              <button type="button" class="h-8 px-[var(--space-2)] rounded-[var(--radius-sm)] text-[length:var(--text-meta)] text-[var(--danger)] hover:bg-[var(--bg-hover)]" aria-expanded="true" aria-label="Permission mode">⚠ Bypass</button>
              <div class="absolute bottom-full left-0 mb-1 z-[var(--z-popover)] w-52 rounded-[var(--radius-md)] border border-[var(--border)] bg-[var(--bg-raised)] py-[var(--space-1)]">
                <button type="button" class="w-full min-h-8 text-left px-[var(--space-3)] text-[length:var(--text-ui)] hover:bg-[var(--bg-hover)]">Ask</button>
                <button type="button" class="w-full min-h-8 text-left px-[var(--space-3)] text-[length:var(--text-ui)] hover:bg-[var(--bg-hover)]">Accept</button>
                <button type="button" class="w-full min-h-8 text-left px-[var(--space-3)] text-[length:var(--text-ui)] hover:bg-[var(--bg-hover)]">Plan</button>
                <button type="button" class="w-full min-h-8 text-left px-[var(--space-3)] text-[length:var(--text-ui)] bg-[var(--accent-subtle)] text-[var(--danger)]">⚠ Bypass</button>
              </div>
            </div>
            <select class="h-8 bg-transparent text-[length:var(--text-meta)] text-[var(--text-muted)] border-0" aria-label="Model">
              <option selected>grok-4.6</option>
            </select>
            <select class="h-8 bg-transparent text-[length:var(--text-meta)] text-[var(--text-muted)] border-0" aria-label="Reasoning effort">
              <option>low</option>
              <option selected>medium</option>
              <option>high</option>
            </select>
            <button type="button" class="ml-auto h-8 px-[var(--space-3)] rounded-[var(--radius-sm)] bg-[var(--btn-primary-bg)] text-[var(--btn-primary-fg)] text-[length:var(--text-body)] font-[var(--weight-medium)] hover:bg-[var(--btn-primary-hover)]">Send</button>
          </div>
        </div>
      </form>
    </aside>

  </body>
</html>
