<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Composer — Grok Build</title>
    <link rel="stylesheet" href="../design-system/tokens.css" />
    <link rel="stylesheet" href="../components/chrome.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="gb-page">
    <aside class="gb-rail" style="position:relative">
      <header class="gb-header">
        <div class="gb-brand">
          <span class="gb-brand-mark" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M5 0.6 9.4 5 5 9.4 0.6 5Z" fill="currentColor"/></svg></span>
          <span>GROK BUILD</span>
          <span class="gb-brand-tag">unofficial</span>
        </div>
        <div class="gb-header-actions">
          <button class="gb-icon" data-theme-toggle aria-label="Switch to light theme"><svg class="gb-theme-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg><svg class="gb-theme-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.8 2.6a5.4 5.4 0 1 0 3.6 9.5 4.6 4.6 0 0 1-3.6-9.5z"/></svg><span class="gb-tooltip">Switch to light theme</span></button>
          <button class="gb-icon" title="New session" aria-label="New session"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg></button>
          <button class="gb-icon" title="Session history" aria-label="Session history"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.5l2 1.5"/></svg></button>
          <button class="gb-icon" title="Rewind to an earlier prompt" aria-label="Rewind"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
          <button class="gb-icon" title="Hide thinking" aria-label="Toggle thinking"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2.5 9 6l3.5.2L10 8.5 11 12 8 10l-3 2 1-3.5-2.5-2.3L7 6z"/></svg></button>
          <button class="gb-icon is-active" title="More" aria-label="More" aria-expanded="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="3.5" cy="8" r=".75" fill="currentColor"/><circle cx="8" cy="8" r=".75" fill="currentColor"/><circle cx="12.5" cy="8" r=".75" fill="currentColor"/></svg></button>
        </div>
      </header>

      <div class="absolute right-[var(--space-4)] top-12 z-[var(--z-popover)] w-56 rounded-[var(--radius-lg)] bg-[var(--bg-raised)] py-[var(--space-2)] text-[length:var(--text-ui)]">
        <button class="w-full min-h-8 text-left px-[var(--space-4)] py-[var(--space-2)] hover:bg-[var(--bg-hover)]">Open user config</button>
        <button class="w-full min-h-8 text-left px-[var(--space-4)] py-[var(--space-2)] text-[var(--text-muted)] opacity-[var(--btn-disabled-opacity)] cursor-[var(--btn-disabled-cursor)]" disabled>MCP servers · config only</button>
        <button class="w-full min-h-8 text-left px-[var(--space-4)] py-[var(--space-2)] text-[var(--text-muted)] opacity-[var(--btn-disabled-opacity)] cursor-[var(--btn-disabled-cursor)]" disabled>Select skills… · leader-only</button>
        <button class="w-full min-h-8 text-left px-[var(--space-4)] py-[var(--space-2)] hover:bg-[var(--bg-hover)]">Output log</button>
        <button class="w-full min-h-8 text-left px-[var(--space-4)] py-[var(--space-2)] text-[var(--danger)] hover:bg-[var(--btn-danger-hover)]">Restart agent</button>
        <button class="w-full min-h-8 text-left px-[var(--space-4)] py-[var(--space-2)] hover:bg-[var(--bg-hover)]">About</button>
      </div>

      <div class="gb-scroll px-4 py-5">
        <div class="flex justify-end">
          <p class="m-0 max-w-[85%] rounded-[var(--radius-lg)] bg-[var(--bg-raised)] px-[var(--space-4)] py-[var(--space-2)] text-[length:var(--text-ui)]">Show me context after this turn.</p>
        </div>
      </div>

      <div class="shrink-0 px-[var(--space-4)]">
        <div class="mb-[var(--space-2)] rounded-[var(--radius-lg)] bg-[var(--bg-raised)] px-[var(--space-4)] py-[var(--space-3)]">
          <div class="flex items-center justify-between gap-[var(--space-2)]">
            <p class="m-0 text-[length:var(--text-ui)] text-[var(--text-muted)]"><span class="inline-grid place-items-center min-w-5 h-5 rounded-full bg-[var(--bg-inset)] text-[length:var(--text-meta)]">2</span> Waiting to send</p>
            <div class="flex gap-[var(--space-1)]">
              <button class="min-h-8 px-[var(--space-2)] text-[length:var(--text-meta)] text-[var(--text-muted)] hover:text-[var(--text)]">Send all now</button>
              <button class="min-h-8 px-[var(--space-2)] text-[length:var(--text-meta)] text-[var(--text-muted)] hover:text-[var(--text)]">Clear</button>
            </div>
          </div>
          <div class="mt-[var(--space-2)] flex items-center justify-between gap-[var(--space-2)] text-[length:var(--text-meta)] text-[var(--text-muted)]">
            <span class="truncate">Also run the smoke test after typecheck.</span>
            <button class="min-h-8 px-[var(--space-2)] shrink-0">Send</button>
          </div>
        </div>
      </div>

      <form class="gb-composer" action="#">
        <textarea rows="1" placeholder="Ask anything"></textarea>
        <div class="gb-toolbar">
          <div class="gb-toolbar-left">
            <button type="button" class="gb-icon" title="Attach image" aria-label="Attach image"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
            <div class="relative">
              <button type="button" class="gb-chip gb-dd is-open" aria-expanded="true" aria-label="Permission mode">Ask</button>
              <div class="gb-menu absolute bottom-[calc(100%+10px)] left-0 z-[var(--z-popover)] w-[14rem]">
                <button type="button" class="gb-menu-item is-checked">Ask<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m3.2 8.2 3.1 3.1 6.5-7"/></svg></button>
                <button type="button" class="gb-menu-item">Accept</button>
                <button type="button" class="gb-menu-item">Plan</button>
                <button type="button" class="gb-menu-item">Bypass</button>
              </div>
            </div>
            <button type="button" class="gb-chip gb-dd">Grok 4.6</button>
            <button type="button" class="gb-chip gb-dd">Fast</button>
          </div>
          <button type="button" class="gb-send" aria-label="Send" title="Send"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M8 12.5V3.5M4.5 7 8 3.5 11.5 7"/></svg></button>
        </div>
      </form>
    </aside>
    <script src="../components/theme.js"></script>
  </body>
</html>
